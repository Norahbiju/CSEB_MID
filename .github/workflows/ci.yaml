name: CI pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write        # ✅ needed for git push
  packages: write        # ✅ needed for GHCR push

jobs:

# ---------------- SONAR ----------------
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=cseb_mid
            -Dsonar.sources=.

      - uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

# ---------------- SNYK ----------------
  snyk:
    runs-on: ubuntu-latest
    needs: sonar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install

      - uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium --exit-code=0

# ---------------- DOCKER BUILD ----------------
  docker:
    runs-on: ubuntu-latest
    needs: snyk

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/$REPO:${{ github.sha }}" >> $GITHUB_ENV
          echo "CACHE_IMAGE=ghcr.io/$REPO:buildcache" >> $GITHUB_ENVldcache" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max

# ---------------- MANUAL APPROVAL ----------------
  approval:
    name: Manual Approval for Deployment
    runs-on: ubuntu-latest
    needs: docker

    environment:
      name: production

    steps:
      - name: Approved
        run: echo "Deployment approved"

        